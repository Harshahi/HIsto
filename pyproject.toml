[project]
name = "histogram"
version = "0.1.0"
description = "Encoder for Deng and Raviv, 'Efficient Vector Symbolic Architectures from Histogram Recovery' (arXiv:2511.01838)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.uv]
# notebooks only -- nothing here is importable as a distribution, so uv should not
# try to build the project itself when syncing.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is not a package; conftest.py is imported directly by the test modules
pythonpath = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
