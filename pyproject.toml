[project]
name = "histogram"
version = "0.1.0"
description = "Encoder for Deng and Raviv, 'Efficient Vector Symbolic Architectures from Histogram Recovery' (arXiv:2511.01838)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.uv]
# notebooks only -- nothing here is importable as a distribution, so uv should not
# try to build the project itself when syncing.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is not a package; conftest.py is imported directly by the test modules
pythonpath = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    # decodes at d >= 2 cost ~25s each; run them with: pytest -m slow
    "slow: a test that runs real higher-multiplicity decodes",
]
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
# guruswami_sudan.ipynb only. Sage's GRSGuruswamiSudanDecoder is the only
# off-the-shelf Guruswami-Sudan list decoder available for Python; passagemath is
# the pip-installable, wheel-shipping fork of SageMath that provides it. Kept in
# its own group because it is ~200 MB and nothing else in the project needs it:
#     uv sync --group sage
# streamlit_app/ only.
#     uv sync --group app --group sage
app = [
    "streamlit>=1.40",
    "pandas>=2.2",
]
sage = [
    "passagemath-modules>=10.8",
    "passagemath-categories>=10.8",
    "passagemath-pari>=10.8",
    "passagemath-symbolics>=10.8",
    "passagemath-ntl>=10.8",
    # Without this every matrix falls back to Matrix_generic_dense -- each entry a
    # boxed Sage object dispatched through Python -- including GF(2) and GF(3),
    # which normally get M4RI and LinBox/FFLAS-FFPACK. Measured on a 1200x900
    # right_kernel: 20.8s generic, 0.32s via the GF(3) embedding with this
    # installed, a 65x difference on the stage that is ~76% of a decode.
    #
    # GF(27) itself stays generic even with this -- full SageMath has no fast class
    # for odd-characteristic extension fields either -- so core.unbundle does not
    # speed up on its own. This is the prerequisite for embedding into the prime
    # field, not the speedup.
    "passagemath-linbox>=10.8",
]
